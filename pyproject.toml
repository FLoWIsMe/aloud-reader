[project]
name = "aloud-reader"
version = "0.1.0"
description = "Aloud for the web: read anything out loud with natural voices that run on your own computer."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "kokoro-onnx>=0.6.1",
    "onnxruntime>=1.20",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdown-it-py>=3.0",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]  # Depends() and File() in defaults is the FastAPI idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:.*httpx2.*"]
