name: Publish image

# Builds the container for amd64 and arm64 and pushes it to GitHub Container Registry on
# every push to main (as :latest and :main) and on version tags (as :1.2.3 and :1.2).
# No setup needed: GITHUB_TOKEN can push to ghcr.io/<owner>/aloud-reader.
#
# To publish to Docker Hub as well, add two repository secrets:
#   DOCKERHUB_USERNAME  your Docker Hub username
#   DOCKERHUB_TOKEN     an access token from https://hub.docker.com/settings/security
# The image is then also pushed as docker.io/<DOCKERHUB_USERNAME>/aloud-reader.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          images="ghcr.io/${owner}/aloud-reader"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            images="${images}"$'\n'"docker.io/${DOCKERHUB_USERNAME}/aloud-reader"
          fi
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Aloud
            org.opencontainers.image.description=Read anything out loud with natural voices that run on your own computer.
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
